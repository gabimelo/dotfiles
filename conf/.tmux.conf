set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*-256color:Tc"

set -g prefix C-a
unbind C-b
bind a send-prefix

set -sg escape-time 1
set -g history-limit 5000
set -g renumber-windows on

set-option -g base-index 1
setw -g pane-base-index 1

bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}" \; split-window -h -l 46% -c "#{pane_current_path}" \; select-pane -L \; split-window -v -l 19% -c "#{pane_current_path}" \; select-pane -U

set-window-option -g xterm-keys on

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h select-window -t -1
bind -r C-l select-window -t +1
bind -r Tab last-window
bind -r < swap-window -t -1
bind -r > swap-window -t +1

set -g status-position top
set-window-option -g monitor-bell on
set -g status-bg "#1a1b26"
set -g status-fg "#7aa2f7"
set -g status-left "#[fg=#7aa2f7,bg=#1a1b26] #S "
set -g status-right "#[fg=#7aa2f7,bg=#1a1b26] %Y-%m-%d %H:%M #[fg=#7aa2f7]"

bind-key w run-shell "tmux list-windows -F '##{window_index}: ##{window_name} (##{pane_current_path})' | fzf-tmux -p --reverse | cut -d: -f1 | xargs -I{} tmux select-window -t {}"
bind g display-popup -w 80% -h 80% -E "tmux new-session -A -s scratch"

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; else cat >/dev/null; fi'"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; else cat >/dev/null; fi'"

set -g allow-passthrough on
set -as terminal-overrides ',xterm-256color:clipboard+'
